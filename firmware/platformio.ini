; =============================================================================
;  EPROMnator — firmware do gravador de EEPROM (Arduino Nano / ATmega328P)
; =============================================================================
;
;  Ambientes:
;    nano        → firmware principal, protocolo binário (bootloader novo)
;    nano_old    → idem, para clones com bootloader antigo (upload a 57600)
;    nano_debug  → shell de depuração em texto (testes da placa)
;    native      → testes unitários no PC (framing e CRC)
;
;  Uso:
;    pio run -e nano -t upload        ; compila e grava no Nano
;    pio run -e nano_debug -t upload  ; grava o shell de depuração
;    pio device monitor               ; abre o monitor serial (115200)
;    pio test -e native               ; roda os testes unitários no PC
; =============================================================================

[platformio]
default_envs = nano

; Configuração comum a todos os ambientes AVR.
[avr_common]
platform = atmelavr
framework = arduino
monitor_speed = 115200
build_flags =
    ; Aumenta o buffer de recepção da Serial (padrão: 64 bytes).
    -DSERIAL_RX_BUFFER_SIZE=128
    ; Cabeçalho do protocolo compartilhado com o software do PC.
    -I$PROJECT_DIR/../protocol
; Avisos extras apenas para o nosso código (o framework Arduino gera muitos).
build_src_flags =
    -Wall
    -Wextra
; Os testes de "test/" são exclusivamente nativos.
test_ignore = *

[env:nano]
extends = avr_common
board = nanoatmega328new

[env:nano_old]
extends = avr_common
board = nanoatmega328

[env:nano_debug]
extends = avr_common
board = nanoatmega328new
build_flags =
    ${avr_common.build_flags}
    -DEPN_DEBUG_SHELL

[env:native]
platform = native
test_framework = unity
build_flags =
    -std=c++17
    -I$PROJECT_DIR/../protocol
; Bibliotecas que dependem do hardware AVR não são compiladas no PC.
lib_ignore =
    bus
    eeprom28c
