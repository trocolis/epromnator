; =============================================================================
;  EPROMnator — firmware do gravador de EEPROM (Arduino Nano / ATmega328P)
; =============================================================================
;
;  Ambientes:
;    nano        → firmware principal (bootloader novo, 115200 baud de upload)
;    nano_old    → mesmo firmware para clones com bootloader antigo (57600)
;
;  Uso:
;    pio run -e nano -t upload        ; compila e grava no Nano
;    pio device monitor -e nano       ; abre o monitor serial
; =============================================================================

[platformio]
default_envs = nano

; Configuração comum a todos os ambientes AVR.
[avr_common]
platform = atmelavr
framework = arduino
monitor_speed = 115200
build_flags =
    ; Aumenta o buffer de recepção da Serial (padrão: 64 bytes).
    -DSERIAL_RX_BUFFER_SIZE=128
; Avisos extras apenas para o nosso código (o framework Arduino gera muitos).
build_src_flags =
    -Wall
    -Wextra

[env:nano]
extends = avr_common
board = nanoatmega328new

[env:nano_old]
extends = avr_common
board = nanoatmega328
